<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Owner Account — Vustela PG Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-dark); color: var(--text-light); font-family: var(--font-main); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">V</div>
        <div>
          <div class="brand-name">VUSTELA <span style="color: var(--accent-rose); font-weight: 700;">PG MANAGEMENT</span></div>
        </div>
      </a>
      <div class="header-right-group">
        <a href="index.html" class="btn-pg-login" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In / Login
        </a>
      </div>
    </div>
  </header>

  <!-- Full Page Register Form Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="width: 100%; max-width: 500px; background: var(--bg-card-dark); border: 1px solid var(--border-color); border-radius: 24px; padding: 2.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(16px);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(244, 63, 94, 0.1); border: 1px solid var(--accent-rose); display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--accent-rose); margin-bottom: 1rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-light); margin-bottom: 0.5rem;">Owner Registration</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5;">
          Register your mobile phone number to create your Vustela Hostel Owner account.
        </p>
      </div>

      <form id="fullRegisterForm" onsubmit="submitOwnerRegistrationFull(event)">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Owner Full Name *</label>
          <input type="text" id="reg_mgr" class="form-control" placeholder="e.g. Sampath Reddy" required style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem;">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Mobile Phone Number *</label>
          <div style="display: flex; gap: 8px;">
            <input type="tel" id="reg_phone" class="form-control" placeholder="e.g. 9876543210" required style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem;">
            <button type="button" class="btn btn-secondary" style="white-space: nowrap; font-size: 0.8rem; font-weight: 700; padding: 0.85rem 1rem; border-radius: 12px;" onclick="sendRegisterOTP()" id="btnSendRegOtp">
              📲 Send OTP
            </button>
          </div>
          <div id="regOtpStatus" style="font-size: 0.8rem; color: #38bdf8; margin-top: 6px; display: none;"></div>
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Enter 6-Digit OTP *</label>
          <input type="text" id="reg_otp" class="form-control" placeholder="6-Digit WhatsApp OTP" maxlength="6" style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem;">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Create Owner Password *</label>
          <input type="password" id="reg_password" class="form-control" placeholder="Create a strong password" required style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem;">
        </div>

        <button type="submit" class="btn btn-accent" style="width: 100%; padding: 1rem; font-size: 1rem; font-weight: 800; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          <i class="fa-solid fa-check-circle"></i> Submit
        </button>
      </form>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    function submitOwnerRegistrationFull(e) {
      e.preventDefault();
      submitOwnerRegistration();
      localStorage.setItem('vustela_show_setup', 'true');
      window.location.href = 'index.html?action=setup';
    }
  </script>
</body>
</html>
