<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Vustela PG Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--bg-dark); color: var(--text-light); font-family: var(--font-main); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">V</div>
        <div>
          <div class="brand-name">VUSTELA <span style="color: var(--accent-rose); font-weight: 700;">PG MANAGEMENT</span></div>
        </div>
      </a>
      <div class="header-right-group">
        <a href="register.html" class="btn-pg-register" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-user"></i> Register PG
        </a>
      </div>
    </div>
  </header>

  <!-- Full Page Sign In Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="width: 100%; max-width: 460px; background: var(--bg-card-dark); border: 1px solid var(--border-color); border-radius: 24px; padding: 2.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(16px);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-cyan); display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; color: var(--accent-cyan); margin-bottom: 1rem;">
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-light); margin-bottom: 0.5rem;">Sign In to Your Portal</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Access your Owner, Manager, or Tenant dashboard.
        </p>
      </div>

      <form id="fullSignInForm" onsubmit="handleSignInSubmit(event)">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Mobile Phone / Email *</label>
          <input type="text" id="login_id" class="form-control" placeholder="e.g. +91 98765 43210" required style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem;">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Password *</label>
          <input type="password" id="login_pwd" class="form-control" placeholder="••••••••" required style="width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem;">
        </div>

        <button type="submit" class="btn btn-accent" style="width: 100%; padding: 1rem; font-size: 1rem; font-weight: 700; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal
        </button>
      </form>

    </div>
  </main>

  <script>
    function handleSignInSubmit(e) {
      e.preventDefault();
      window.location.href = "hostel_app.html?action=signin";
    }
  </script>
</body>
</html>
